<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>صبغ البالونات</title>
<style>
:root{color-scheme:light;--ink:#2d2a4a;--card:#ffffff;--muted:#6b6785}
*{box-sizing:border-box}
body{margin:0;font-family:Tahoma,"Segoe UI",Arial,sans-serif;background:linear-gradient(180deg,#d6f0ff,#fff7e6);color:var(--ink);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:env(safe-area-inset-top,0px) 12px env(safe-area-inset-bottom,0px);overflow-x:hidden}
h1{font-size:1.4rem;margin:16px 0 4px}
.meta{font-weight:bold;color:var(--muted);margin-bottom:8px}
.target{background:var(--card);border-radius:22px;padding:12px 18px;font-size:1.2rem;font-weight:bold;box-shadow:0 5px 0 rgba(0,0,0,.08);margin-bottom:10px;display:flex;align-items:center;gap:10px}
#swatch{width:44px;height:44px;border-radius:50%;border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.2)}
#sky{position:relative;width:100%;max-width:520px;height:420px;border-radius:24px;overflow:hidden;background:linear-gradient(180deg,#a5dbff,#e6f7ff);box-shadow:0 6px 0 rgba(0,0,0,.08)}
.bal{position:absolute;bottom:-70px;width:56px;height:68px;border-radius:50% 50% 50% 50%/42% 42% 58% 58%;cursor:pointer;animation:up 7s linear forwards;box-shadow:inset -6px -6px 0 rgba(0,0,0,.12);touch-action:manipulation}
.bal::after{content:"";position:absolute;bottom:-18px;left:50%;width:2px;height:20px;background:#999}
@keyframes up{to{transform:translateY(-500px)}}
.pop{animation:popOut .25s forwards!important}
@keyframes popOut{to{transform:scale(1.5);opacity:0}}
.shake{animation:shk .35s}
@keyframes shk{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.fb{min-height:1.6em;margin-top:10px;font-weight:bold;text-align:center}
.next{margin-top:10px;padding:10px 22px;border:none;border-radius:999px;background:#4dabf7;color:#fff;font-size:1rem;cursor:pointer;display:none;font-family:inherit}
</style>
</head>
<body>
<h1>🎈 صبغ البالونات</h1>
<div class="meta">الجولة <span id="rnd">1</span> من <span id="maxr">5</span></div>
<div class="target">
  <span>اضغط على البالونات</span>
  <span id="swatch"></span>
  <span id="cname"></span>
</div>
<div id="sky"></div>
<div class="fb" id="fb"></div>
<button class="next" id="next" type="button">الجولة التالية</button>

<script>
const COLORS=[{n:'الأحمر',c:'#ff5252'},{n:'الأزرق',c:'#4dabf7'},{n:'الأصفر',c:'#ffd43b'},{n:'الأخضر',c:'#51cf66'},{n:'البنفسجي',c:'#b197fc'}];
const ROUNDS=5, NEED=3;
let round=1, target=null, got=0, locked=false, spawner=null;
const $=id=>document.getElementById(id);
const pick=a=>a[Math.floor(Math.random()*a.length)];

function setTarget(){
  target=pick(COLORS); got=0; locked=false;
  $('swatch').style.background=target.c;
  $('cname').textContent='باللون '+target.n;
  $('rnd').textContent=round; $('maxr').textContent=ROUNDS;
  $('fb').textContent=''; $('next').style.display='none';
}

function spawn(){
  if(locked) return;
  const sky=$('sky');
  const b=document.createElement('div');
  const isTarget=Math.random()<0.45;
  const col=isTarget?target:pick(COLORS);
  b.className='bal';
  b.style.background=col.c;
  b.style.left=(5+Math.random()*80)+'%';
  b.dataset.c=col.c;
  b.addEventListener('click',()=>tap(b));
  sky.appendChild(b);
  setTimeout(()=>b.remove(),7200);
}

function tap(b){
  if(locked||b.classList.contains('pop')) return;
  if(b.dataset.c===target.c){
    b.classList.add('pop');
    got++;
    $('fb').textContent='برافو! 👏';
    if(got>=NEED){
      locked=true;
      if(round>=ROUNDS){
        $('fb').textContent='🏆 أنهيت كل الجولات! أنت بطل الألوان';
        $('next').textContent='العب مرة أخرى'; $('next').style.display='inline-block';
        fxCelebrate('🏆 أنت بطل الألوان! 🏆');
      }else{
        $('fb').textContent='🎉 أحسنت! ننتقل للجولة التالية';
        $('next').textContent='الجولة التالية'; $('next').style.display='inline-block';
        fxCelebrate(['أحسنت يا بطل! 👏','رائع! 🌟','ممتاز! 🎉'][Math.floor(Math.random()*3)]);
      }
    }
  }else{
    b.classList.add('shake');
    setTimeout(()=>b.classList.remove('shake'),400);
    $('fb').textContent='هذا لون آخر، جرّب مرة أخرى 💪';
  }
}

$('next').addEventListener('click',()=>{
  if(round>=ROUNDS){ round=1; setTarget(); return; }
  round++; setTarget();
});
// اجعل كل الجولات تبدأ بلون جديد
setTarget();
spawner=setInterval(spawn,850);
</script>

<style>
#fxLayer{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:9999}
.fxB{position:absolute;bottom:-80px;width:44px;height:54px;border-radius:50% 50% 50% 50%/40% 40% 60% 60%;animation:fxRise 2.6s ease-out forwards}
@keyframes fxRise{to{transform:translateY(-115vh)}}
.fxC{position:absolute;top:-20px;width:9px;height:14px;animation:fxFall 2.4s linear forwards}
@keyframes fxFall{to{transform:translateY(110vh) rotate(720deg)}}
#fxMsg{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%) scale(.6);background:#fff;color:#2d2a4a;padding:16px 24px;border-radius:24px;font-size:1.3rem;font-weight:bold;box-shadow:0 10px 30px rgba(0,0,0,.2);opacity:0;transition:all .35s;z-index:10000;white-space:nowrap;font-family:Tahoma,Arial,sans-serif;pointer-events:none}
#fxMsg.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
</style>
<div id="fxLayer"></div><div id="fxMsg"></div>
<script>
function fxCelebrate(text){
  var L=document.getElementById('fxLayer'),M=document.getElementById('fxMsg');
  var C=['#ff6b9d','#ffa94d','#4dabf7','#63e6be','#ffd43b','#da77f2'];
  L.innerHTML='';
  for(var i=0;i<12;i++){var b=document.createElement('div');b.className='fxB';b.style.left=(Math.random()*90)+'%';b.style.background=C[i%6];b.style.animationDelay=(Math.random()*.6)+'s';L.appendChild(b);}
  for(var j=0;j<60;j++){var c=document.createElement('div');c.className='fxC';c.style.left=(Math.random()*100)+'%';c.style.background=C[j%6];c.style.animationDelay=(Math.random()*.8)+'s';L.appendChild(c);}
  try{
    var ctx=new (window.AudioContext||window.webkitAudioContext)();
    for(var k=0;k<14;k++){
      var t0=ctx.currentTime+k*.09+Math.random()*.03,len=Math.floor(ctx.sampleRate*.05);
      var buf=ctx.createBuffer(1,len,ctx.sampleRate),d=buf.getChannelData(0);
      for(var n=0;n<len;n++)d[n]=(Math.random()*2-1)*Math.exp(-n/(len*.25));
      var src=ctx.createBufferSource(),f=ctx.createBiquadFilter(),g=ctx.createGain();
      f.type='bandpass';f.frequency.value=1800;f.Q.value=.8;g.gain.value=.6;
      src.buffer=buf;src.connect(f);f.connect(g);g.connect(ctx.destination);src.start(t0);
    }
  }catch(e){}
  M.textContent=text;M.classList.add('show');
  setTimeout(function(){M.classList.remove('show');L.innerHTML='';},2200);
}
</script>

</body>
</html>
